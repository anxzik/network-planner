<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/><stop offset="100%" stop-color="#b8d4f0"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">PROJECT FILES - RECORDED DEFINITIONS AND FORMAT LIFECYCLE</text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MOBILE</text>
  <g id="desktop" transform="translate(40, 60)" font-family="system-ui, sans-serif">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="1280" height="48" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="0" y="24" width="1280" height="24" fill="#dcc8a8"/>
    <text x="20" y="31" font-size="15" fill="#1f2937" font-weight="bold">Network Planner</text>
    <text x="200" y="31" font-size="14" fill="#1f2937" font-weight="bold">warehouse-b.netplan</text>
    <rect x="40" y="80" width="600" height="250" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="60" y="110" font-size="15" fill="#1f2937" font-weight="bold">This plan carries an older definition</text>
    <g font-size="14" fill="#4b5563">
    <text x="60" y="140" font-size="14" fill="#4b5563">Catalyst 9300-48P was corrected in your library after this</text>
    <text x="60" y="162" font-size="14" fill="#4b5563">plan was made.</text>
    </g>
    <text x="60" y="196" font-size="14" fill="#1f2937">plan copy:  48 ports</text>
    <text x="60" y="222" font-size="14" fill="#1f2937">library now:  52 ports</text>
    <rect x="60" y="248" width="190" height="38" rx="6" fill="#8b5cf6"/><text x="155" y="272" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Update this plan</text>
    <rect x="258" y="248" width="160" height="38" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="338" y="272" font-size="14" fill="#1f2937" text-anchor="middle">Keep plan copy</text>
    <text x="60" y="312" font-size="14" fill="#4b5563">Keeping the plan copy is remembered; you will not be asked again.</text>
    <rect x="680" y="80" width="560" height="320" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="700" y="110" font-size="15" fill="#1f2937" font-weight="bold">Apply the correction to other plans?</text>
    <g font-size="14">
      <rect x="700" y="130" width="18" height="18" rx="3" fill="#8b5cf6"/><text x="730" y="145" fill="#1f2937">denver-hq.netplan</text>
      <rect x="700" y="160" width="18" height="18" rx="3" fill="#8b5cf6"/><text x="730" y="175" fill="#1f2937">lab-bench.netplan</text>
      <rect x="700" y="190" width="18" height="18" rx="3" fill="#f5f0e6" stroke="#b8a080"/><text x="730" y="205" fill="#1f2937">campus-core.netplan</text>
    </g>
    <text x="700" y="240" font-size="14" fill="#8996a6">branch-office.netplan - unreachable (file missing)</text>
    <text x="700" y="266" font-size="14" fill="#4b5563">Only plans you have opened are listed. Nothing is</text>
    <text x="700" y="288" font-size="14" fill="#4b5563">scanned, and nothing changes outside your choice.</text>
    <rect x="700" y="310" width="170" height="38" rx="6" fill="#8b5cf6"/><text x="785" y="334" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Apply to selected</text>
    <rect x="878" y="310" width="110" height="38" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="933" y="334" font-size="14" fill="#1f2937" text-anchor="middle">None</text>
    <rect x="40" y="440" width="1200" height="240" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="60" y="470" font-size="15" fill="#1f2937" font-weight="bold">Opening older and newer files</text>
    <rect x="60" y="490" width="360" height="170" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="76" y="516" font-size="14" fill="#1f2937" font-weight="bold">site-2025.netplan</text>
    <text x="76" y="540" font-size="14" fill="#4b5563">Written by an older version.</text>
    <text x="76" y="562" font-size="14" fill="#4b5563">Brought forward on open; the original</text>
    <text x="76" y="584" font-size="14" fill="#4b5563">is copied aside and kept.</text>
    <rect x="76" y="606" width="120" height="34" rx="6" fill="#8b5cf6"/><text x="136" y="628" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Open</text>
    <rect x="460" y="490" width="360" height="170" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="476" y="516" font-size="14" fill="#1f2937" font-weight="bold">future-site.netplan</text>
    <text x="476" y="540" font-size="14" fill="#4b5563">Written by a newer version.</text>
    <text x="476" y="562" font-size="14" fill="#4b5563">Not opened, not modified. This plan</text>
    <text x="476" y="584" font-size="14" fill="#4b5563">needs a newer application.</text>
    <rect x="860" y="490" width="360" height="170" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="876" y="516" font-size="14" fill="#1f2937" font-weight="bold">corrupted.netplan</text>
    <text x="876" y="540" font-size="14" fill="#4b5563">Could not be read.</text>
    <text x="876" y="562" font-size="14" fill="#4b5563">Left untouched. Nothing will</text>
    <text x="876" y="584" font-size="14" fill="#4b5563">overwrite it.</text>
    <g class="callout" transform="translate(600, 110)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text></g>
    <g class="callout" transform="translate(1200, 110)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text></g>
    <g class="callout" transform="translate(700, 240)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text></g>
    <g class="callout" transform="translate(400, 516)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">4</text></g>
    <g class="callout" transform="translate(800, 516)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">5</text></g>
    <g class="callout" transform="translate(1200, 516)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">6</text></g>
  </g>
  <g id="mobile" transform="translate(1360, 60)" font-family="system-ui, sans-serif">
    <rect width="360" height="720" rx="12" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="360" height="48" rx="12" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="0" y="26" width="360" height="22" fill="#dcc8a8"/>
    <text x="16" y="31" font-size="15" font-weight="bold" fill="#1f2937">warehouse-b</text>
    <rect x="16" y="62" width="328" height="210" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="30" y="88" font-size="14" font-weight="bold" fill="#1f2937">Older definition in this plan</text>
    <g font-size="14" fill="#4b5563"><text x="30" y="112">Catalyst 9300-48P was corrected</text><text x="30" y="132">after this plan was made.</text></g>
    <g font-size="14" fill="#1f2937"><text x="30" y="162">plan: 48 ports</text><text x="30" y="184">library: 52 ports</text></g>
    <rect x="30" y="202" width="130" height="40" rx="6" fill="#8b5cf6"/>
    <text x="95" y="227" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Update plan</text>
    <rect x="170" y="202" width="120" height="40" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="230" y="227" font-size="14" fill="#1f2937" text-anchor="middle">Keep copy</text>
    <rect x="16" y="292" width="328" height="130" rx="8" fill="#f7ecd9" stroke="#8a5a0c"/>
    <text x="30" y="318" font-size="14" font-weight="bold" fill="#8a5a0c">future-site.netplan</text>
    <g font-size="14" fill="#8a5a0c"><text x="30" y="342">Written by a newer version.</text><text x="30" y="364">Not opened, not modified.</text><text x="30" y="386">Update the application to open it.</text></g>
    <rect x="16" y="442" width="328" height="96" rx="8" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="30" y="468" font-size="14" font-weight="bold" fill="#1f2937">Every device renders</text>
    <g font-size="14" fill="#4b5563"><text x="30" y="490">This plan carries its own copies, so it</text><text x="30" y="510">opens complete on any machine.</text></g>
    <g class="callout" transform="translate(330, 88)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text></g>
    <g class="callout" transform="translate(330, 318)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">5</text></g>
    <g class="callout" transform="translate(330, 468)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">7</text></g>
  </g>
  <g id="annotations" transform="translate(40, 800)" font-family="system-ui, sans-serif">
    <rect width="1840" height="220" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <text x="24" y="30" font-size="14" font-weight="bold" fill="#1f2937">1. US-003 Plans stay truthful</text>
    <text x="24" y="51" font-size="14" fill="#374151">Divergence is shown, an update offered, a decline remembered.</text>
    <g transform="translate(24, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#0891b2"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">US-003</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-016</text>
      <rect x="138" width="62" height="20" rx="10" fill="#2563eb"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-017</text>
      <rect x="207" width="62" height="20" rx="10" fill="#ea580c"/><text x="238" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-005</text>
    </g>
    <text x="560" y="30" font-size="14" font-weight="bold" fill="#1f2937">2. A correction can travel</text>
    <text x="560" y="51" font-size="14" fill="#374151">Shown which plans would change; all, some or none.</text>
    <g transform="translate(560, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-018</text>
    </g>
    <text x="1096" y="30" font-size="14" font-weight="bold" fill="#1f2937">3. Reach is honest</text>
    <text x="1096" y="51" font-size="14" fill="#374151">Unreachable plans are named, never guessed at or scanned for.</text>
    <g transform="translate(1096, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-018</text>
    </g>
    <text x="24" y="126" font-size="14" font-weight="bold" fill="#1f2937">4. US-004 Older files come forward</text>
    <text x="24" y="147" font-size="14" fill="#374151">Upgraded on open, original copied aside and kept.</text>
    <g transform="translate(24, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#0891b2"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">US-004</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-019</text>
      <rect x="138" width="62" height="20" rx="10" fill="#2563eb"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-020</text>
      <rect x="207" width="62" height="20" rx="10" fill="#2563eb"/><text x="238" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-023</text>
      <rect x="276" width="62" height="20" rx="10" fill="#ea580c"/><text x="307" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-006</text>
    </g>
    <text x="560" y="126" font-size="14" font-weight="bold" fill="#1f2937">5. Newer and damaged files</text>
    <text x="560" y="147" font-size="14" fill="#374151">A newer format is refused unopened; damage is never overwritten.</text>
    <g transform="translate(560, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-021</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-022</text>
      <rect x="138" width="62" height="20" rx="10" fill="#ea580c"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-003</text>
    </g>
    <text x="1096" y="126" font-size="14" font-weight="bold" fill="#1f2937">6. Complete anywhere</text>
    <text x="1096" y="147" font-size="14" fill="#374151">Recorded definitions render without the catalogue.</text>
    <g transform="translate(1096, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-014</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-015</text>
      <rect x="138" width="62" height="20" rx="10" fill="#ea580c"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-001</text>
    </g>
  </g>
  <text x="960" y="1060" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold" fill="#4b5563">003:02 | Project Files | SpecKit</text>
</svg>
