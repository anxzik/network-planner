<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/><stop offset="100%" stop-color="#b8d4f0"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">PROJECT FILES - SAVE, OPEN, RECENTS AND THE MIGRATION</text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MOBILE</text>
  <g id="desktop" transform="translate(40, 60)" font-family="system-ui, sans-serif">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="1280" height="48" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="0" y="24" width="1280" height="24" fill="#dcc8a8"/>
    <text x="20" y="31" font-size="15" fill="#1f2937" font-weight="bold">Network Planner</text>
    <text x="200" y="31" font-size="14" fill="#8a5a0c" font-weight="bold">denver-hq.netplan *</text>
    <text x="360" y="31" font-size="14" fill="#8a5a0c">unsaved changes</text>
    <g font-size="14" fill="#4b5563"><text x="960" y="31">File</text><text x="1010" y="31">New</text><text x="1060" y="31">Open</text><text x="1120" y="31">Save</text><text x="1175" y="31">Save As</text></g>
    <rect x="940" y="60" width="320" height="220" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="954" y="84" font-size="14" fill="#1f2937" font-weight="bold">Recent plans</text>
    <g font-size="14" fill="#1f2937"><text x="954" y="112">denver-hq.netplan</text><text x="954" y="140">warehouse-b.netplan</text><text x="954" y="196">lab-bench.netplan</text></g>
    <text x="954" y="168" font-size="14" fill="#8996a6">branch-office.netplan</text>
    <text x="1140" y="168" font-size="14" fill="#8a5a0c">missing - remove?</text>
    <rect x="280" y="180" width="620" height="300" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="300" y="212" font-size="15" fill="#1f2937" font-weight="bold">Your existing plan can become a file</text>
    <g font-size="14" fill="#4b5563">
    <text x="300" y="244" font-size="14" fill="#4b5563">This version keeps plans as files you name and own. Your</text>
    <text x="300" y="268" font-size="14" fill="#4b5563">current topology (14 devices, 3 VLANs) is ready to move.</text>
    <text x="300" y="300" font-size="14" fill="#4b5563">The original stays preserved until you choose to clear it.</text>
    </g>
    <rect x="300" y="330" width="200" height="40" rx="6" fill="#8b5cf6"/>
    <text x="400" y="355" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Save as a file…</text>
    <rect x="516" y="330" width="140" height="40" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="586" y="355" font-size="14" fill="#1f2937" text-anchor="middle">Not now</text>
    <text x="300" y="404" font-size="14" fill="#4b5563">If your old data cannot be read, a copy is kept untouched</text>
    <text x="300" y="426" font-size="14" fill="#4b5563">and nothing overwrites it.</text>
    <rect x="280" y="520" width="420" height="120" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="300" y="548" font-size="14" fill="#1f2937" font-weight="bold">Save changes to denver-hq?</text>
    <g font-size="14" fill="#4b5563"><text x="300" y="572">Opening another plan will close this one.</text></g>
    <rect x="300" y="590" width="90" height="34" rx="6" fill="#8b5cf6"/><text x="345" y="612" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Save</text>
    <rect x="398" y="590" width="110" height="34" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="453" y="612" font-size="14" fill="#1f2937" text-anchor="middle">Discard</text>
    <rect x="516" y="590" width="90" height="34" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="561" y="612" font-size="14" fill="#1f2937" text-anchor="middle">Cancel</text>
    <rect x="760" y="560" width="480" height="110" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="776" y="588" font-size="14" fill="#1f2937" font-weight="bold">Recovered unsaved work</text>
    <text x="776" y="612" font-size="14" fill="#4b5563">Changes from your last session were kept. Restore them?</text>
    <rect x="776" y="628" width="100" height="30" rx="6" fill="#8b5cf6"/><text x="826" y="648" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Restore</text>
    <g class="callout" transform="translate(285, 31)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text></g>
    <g class="callout" transform="translate(590, 212)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text></g>
    <g class="callout" transform="translate(1240, 168)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text></g>
    <g class="callout" transform="translate(285, 548)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">4</text></g>
    <g class="callout" transform="translate(770, 588)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">5</text></g>
    <g class="callout" transform="translate(1245, 84)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">6</text></g>
  </g>
  <g id="mobile" transform="translate(1360, 60)" font-family="system-ui, sans-serif">
    <rect width="360" height="720" rx="12" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="360" height="48" rx="12" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="0" y="26" width="360" height="22" fill="#dcc8a8"/>
    <text x="16" y="31" font-size="15" font-weight="bold" fill="#1f2937">Plans</text>
    <rect x="16" y="62" width="328" height="150" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="30" y="88" font-size="14" font-weight="bold" fill="#1f2937">Move your plan to a file</text>
    <g font-size="14" fill="#4b5563"><text x="30" y="112">14 devices, 3 VLANs ready.</text><text x="30" y="134">The original stays preserved.</text></g>
    <rect x="30" y="152" width="140" height="40" rx="6" fill="#8b5cf6"/>
    <text x="100" y="177" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Save as file</text>
    <g font-size="14">
      <rect x="16" y="228" width="328" height="56" rx="6" fill="#f5f0e6" stroke="#8b5cf6" stroke-width="2"/>
      <text x="30" y="252" font-weight="bold" fill="#1f2937">denver-hq.netplan</text>
      <text x="30" y="272" fill="#8a5a0c">unsaved changes</text>
      <rect x="16" y="296" width="328" height="56" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
      <text x="30" y="320" font-weight="bold" fill="#1f2937">warehouse-b.netplan</text>
      <text x="30" y="340" fill="#4b5563">saved</text>
      <rect x="16" y="364" width="328" height="56" rx="6" fill="#f5f0e6" stroke="#b8a080" stroke-dasharray="4 3"/>
      <text x="30" y="388" fill="#8996a6">branch-office.netplan</text>
      <text x="30" y="408" fill="#8a5a0c">file missing - remove?</text>
    </g>
    <g class="callout" transform="translate(330, 88)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text></g>
    <g class="callout" transform="translate(330, 252)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text></g>
    <g class="callout" transform="translate(330, 388)"><circle r="14" fill="#dc2626"/><text y="5" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text></g>
  </g>
  <g id="annotations" transform="translate(40, 800)" font-family="system-ui, sans-serif">
    <rect width="1840" height="220" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <text x="24" y="30" font-size="14" font-weight="bold" fill="#1f2937">1. US-001 A plan is a file</text>
    <text x="24" y="51" font-size="14" fill="#374151">Named, saved where you choose, always showing its state.</text>
    <g transform="translate(24, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#0891b2"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">US-001</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-001</text>
      <rect x="138" width="62" height="20" rx="10" fill="#2563eb"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-002</text>
      <rect x="207" width="62" height="20" rx="10" fill="#2563eb"/><text x="238" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-003</text>
      <rect x="276" width="62" height="20" rx="10" fill="#2563eb"/><text x="307" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-004</text>
      <rect x="345" width="62" height="20" rx="10" fill="#2563eb"/><text x="376" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-005</text>
      <rect x="414" width="62" height="20" rx="10" fill="#ea580c"/><text x="445" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-004</text>
    </g>
    <text x="640" y="30" font-size="14" font-weight="bold" fill="#1f2937">2. US-002 The one-time migration</text>
    <text x="640" y="51" font-size="14" fill="#374151">Offered, never silent. The original is preserved until cleared.</text>
    <g transform="translate(640, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#0891b2"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">US-002</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-010</text>
      <rect x="138" width="62" height="20" rx="10" fill="#2563eb"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-011</text>
      <rect x="207" width="62" height="20" rx="10" fill="#2563eb"/><text x="238" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-013</text>
      <rect x="276" width="62" height="20" rx="10" fill="#ea580c"/><text x="307" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-002</text>
      <rect x="345" width="62" height="20" rx="10" fill="#ea580c"/><text x="376" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-007</text>
    </g>
    <text x="1270" y="30" font-size="14" font-weight="bold" fill="#1f2937">3. Recent plans</text>
    <text x="1270" y="51" font-size="14" fill="#374151">A vanished file is offered for removal, never silently dropped.</text>
    <g transform="translate(1270, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-007</text>
    </g>
    <text x="24" y="126" font-size="14" font-weight="bold" fill="#1f2937">4. Nothing lost without consent</text>
    <text x="24" y="147" font-size="14" fill="#374151">Closing or switching with changes prompts first.</text>
    <g transform="translate(24, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-006</text>
    </g>
    <text x="640" y="126" font-size="14" font-weight="bold" fill="#1f2937">5. Crash recovery</text>
    <text x="640" y="147" font-size="14" fill="#374151">Unsaved work survives a force-quit and is offered back.</text>
    <g transform="translate(640, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-009</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-008</text>
    </g>
    <text x="1270" y="126" font-size="14" font-weight="bold" fill="#1f2937">6. Unreadable old storage</text>
    <text x="1270" y="147" font-size="14" fill="#374151">Preserved untouched and reported; an empty start, never destruction.</text>
    <g transform="translate(1270, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-012</text>
    </g>
  </g>
  <text x="960" y="1060" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold" fill="#4b5563">003:01 | Project Files | SpecKit</text>
</svg>
