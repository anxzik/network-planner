<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/><stop offset="100%" stop-color="#b8d4f0"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">PROJECT FILES - ADOPTING TYPES AND PRESERVED COPIES</text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MOBILE</text>

  <g id="desktop" transform="translate(40, 60)" font-family="system-ui, sans-serif">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="1280" height="48" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="0" y="24" width="1280" height="24" fill="#dcc8a8"/>
    <text x="20" y="31" font-size="15" fill="#1f2937" font-weight="bold">Network Planner</text>
    <text x="200" y="31" font-size="14" fill="#1f2937" font-weight="bold">from-colleague.netplan</text>
    <text x="440" y="31" font-size="14" fill="#6b7280">opened complete - 3 types not in your catalogue</text>

    <!-- Adopt panel -->
    <rect x="40" y="80" width="600" height="330" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="60" y="110" font-size="15" fill="#1f2937" font-weight="bold">Keep these types in your catalogue?</text>
    <text x="60" y="132" font-size="14" fill="#374151">The plan already renders them. Adopting only adds them to your library.</text>

    <rect x="60" y="150" width="560" height="52" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="76" y="167" width="18" height="18" rx="4" fill="#2563eb" stroke="#1e40af"/>
    <path d="M80 176 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
    <text x="106" y="172" font-size="14" font-weight="bold" fill="#1f2937">Ubiquiti EdgeSwitch 24-Lite</text>
    <text x="106" y="192" font-size="14" fill="#374151">24 ports - locally created by the sender</text>

    <rect x="60" y="212" width="560" height="52" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="76" y="229" width="18" height="18" rx="4" fill="#2563eb" stroke="#1e40af"/>
    <path d="M80 238 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
    <text x="106" y="234" font-size="14" font-weight="bold" fill="#1f2937">Kenwood NX-5800 (RF)</text>
    <text x="106" y="254" font-size="14" fill="#374151">P25 mobile - locally created by the sender</text>

    <rect x="60" y="274" width="560" height="52" rx="6" fill="#efe6d6" stroke="#b8a080"/>
    <rect x="76" y="291" width="18" height="18" rx="4" fill="#c7bda8" stroke="#a89880"/>
    <text x="106" y="296" font-size="14" font-weight="bold" fill="#6b7280">Cisco Catalyst 2960-X</text>
    <text x="106" y="316" font-size="14" fill="#9a6b2f">Already in your catalogue - skipped, never overwritten</text>

    <rect x="60" y="342" width="150" height="36" rx="6" fill="#2563eb"/>
    <text x="135" y="365" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">Adopt 2 types</text>
    <rect x="222" y="342" width="120" height="36" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="282" y="365" font-size="14" fill="#1f2937" text-anchor="middle">Not now</text>
    <text x="360" y="365" font-size="14" fill="#6b7280">Either way, the plan is unchanged.</text>

    <!-- Preserved artifacts panel -->
    <rect x="672" y="80" width="568" height="330" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="694" y="110" font-size="15" fill="#1f2937" font-weight="bold">Copies kept for warehouse-b.netplan</text>
    <text x="694" y="132" font-size="14" fill="#374151">One slot each. Nothing here is removed unless you say so.</text>

    <rect x="694" y="150" width="524" height="58" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="712" y="172" font-size="14" font-weight="bold" fill="#1f2937">warehouse-b.netplan.partial</text>
    <text x="712" y="192" font-size="14" fill="#374151">What you were saving - newer, may be incomplete</text>
    <rect x="1108" y="163" width="94" height="30" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="1155" y="183" font-size="14" fill="#1f2937" text-anchor="middle">Clear</text>

    <rect x="694" y="216" width="524" height="58" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="712" y="238" font-size="14" font-weight="bold" fill="#1f2937">warehouse-b.netplan.0.9.original</text>
    <text x="712" y="258" font-size="14" fill="#15803d">Upgraded plan saved whole - safe to clear</text>
    <rect x="1108" y="229" width="94" height="30" rx="6" fill="#2563eb"/>
    <text x="1155" y="249" font-size="14" fill="#fff" text-anchor="middle">Clear</text>

    <rect x="694" y="282" width="524" height="58" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="712" y="304" font-size="14" font-weight="bold" fill="#1f2937">warehouse-b.netplan.preapply.original</text>
    <text x="712" y="324" font-size="14" fill="#374151">Before the last library correction was applied</text>
    <rect x="1108" y="295" width="94" height="30" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="1155" y="315" font-size="14" fill="#1f2937" text-anchor="middle">Clear</text>

    <text x="694" y="366" font-size="14" fill="#9a6b2f">A repeat failure replaces its slot. Nothing accumulates.</text>

    <!-- Save As caveat strip -->
    <rect x="40" y="430" width="1200" height="120" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="60" y="458" font-size="15" font-weight="bold" fill="#1f2937">Save As from a newer-format plan</text>
    <text x="60" y="482" font-size="14" fill="#374151">This copy holds only what this version could read. Content it could not read is not carried over.</text>
    <text x="60" y="504" font-size="14" fill="#9a6b2f">The copy is not a substitute for the original file - that stays the only complete version. Keep it.</text>
    <rect x="60" y="514" width="180" height="26" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="150" y="532" font-size="14" fill="#1f2937" text-anchor="middle">Save a readable copy</text>

    <!-- Unsaved prompt, three outcomes -->
    <rect x="40" y="570" width="1200" height="126" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="60" y="598" font-size="15" font-weight="bold" fill="#1f2937">Unsaved changes to denver-site.netplan</text>
    <text x="60" y="622" font-size="14" fill="#374151">Three outcomes. Escape is a fourth way to reach Discard - and Discard is recoverable.</text>
    <rect x="60" y="638" width="110" height="36" rx="6" fill="#2563eb"/>
    <text x="115" y="661" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">Save</text>
    <rect x="182" y="638" width="110" height="36" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="237" y="661" font-size="14" fill="#b91c1c" text-anchor="middle">Discard  Esc</text>
    <rect x="304" y="638" width="110" height="36" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="359" y="661" font-size="14" fill="#1f2937" text-anchor="middle">Cancel</text>
    <text x="434" y="661" font-size="14" fill="#9a6b2f">Escape discards. Closing this dialog or clicking away means Cancel.</text>
  </g>

  <g id="mobile" transform="translate(1360, 60)" font-family="system-ui, sans-serif">
    <rect width="360" height="720" rx="12" fill="#e8d4b8" stroke="#b8a080"/>
    <rect x="0" y="0" width="360" height="48" rx="12" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="0" y="26" width="360" height="22" fill="#dcc8a8"/>
    <text x="16" y="31" font-size="15" font-weight="bold" fill="#1f2937">from-colleague</text>

    <rect x="16" y="62" width="328" height="250" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="32" y="88" font-size="14" font-weight="bold" fill="#1f2937">Keep these types?</text>
    <text x="32" y="110" font-size="14" fill="#374151">The plan already shows them.</text>
    <rect x="32" y="124" width="296" height="48" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <rect x="46" y="140" width="18" height="18" rx="4" fill="#2563eb" stroke="#1e40af"/>
    <path d="M50 149 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
    <text x="76" y="146" font-size="14" font-weight="bold" fill="#1f2937">EdgeSwitch 24-Lite</text>
    <text x="76" y="164" font-size="14" fill="#374151">24 ports</text>
    <rect x="32" y="180" width="296" height="48" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <rect x="46" y="196" width="18" height="18" rx="4" fill="#2563eb" stroke="#1e40af"/>
    <path d="M50 205 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
    <text x="76" y="202" font-size="14" font-weight="bold" fill="#1f2937">Kenwood NX-5800</text>
    <text x="76" y="220" font-size="14" fill="#374151">P25 mobile</text>
    <rect x="32" y="236" width="296" height="42" rx="6" fill="#efe6d6" stroke="#b8a080"/>
    <text x="46" y="254" font-size="14" font-weight="bold" fill="#6b7280">Catalyst 2960-X</text>
    <text x="46" y="272" font-size="14" fill="#9a6b2f">Already yours - skipped</text>
    <rect x="32" y="286" width="140" height="34" rx="6" fill="#2563eb"/>
    <text x="102" y="308" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">Adopt 2</text>

    <rect x="16" y="330" width="328" height="200" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="32" y="356" font-size="14" font-weight="bold" fill="#1f2937">Copies kept</text>
    <rect x="32" y="370" width="296" height="46" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="46" y="390" font-size="14" fill="#1f2937">.partial</text>
    <text x="46" y="408" font-size="14" fill="#374151">Newer, may be incomplete</text>
    <rect x="32" y="424" width="296" height="46" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="46" y="444" font-size="14" fill="#1f2937">.0.9.original</text>
    <text x="46" y="462" font-size="14" fill="#15803d">Safe to clear</text>
    <text x="32" y="496" font-size="14" fill="#9a6b2f">Cleared only when you ask.</text>

    <rect x="16" y="548" width="328" height="150" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="32" y="574" font-size="14" font-weight="bold" fill="#1f2937">Unsaved changes</text>
    <rect x="32" y="590" width="90" height="34" rx="6" fill="#2563eb"/>
    <text x="77" y="612" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">Save</text>
    <rect x="132" y="590" width="90" height="34" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="177" y="612" font-size="14" fill="#b91c1c" text-anchor="middle">Discard</text>
    <rect x="232" y="590" width="96" height="34" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="280" y="612" font-size="14" fill="#1f2937" text-anchor="middle">Cancel</text>
    <text x="32" y="648" font-size="14" fill="#9a6b2f">Escape discards; it is kept</text>
    <text x="32" y="668" font-size="14" fill="#9a6b2f">in recovery until you decline.</text>
  </g>

  <g id="annotations" transform="translate(40, 800)" font-family="system-ui, sans-serif">
    <rect width="1840" height="220" rx="8" fill="#e8d4b8" stroke="#b8a080"/>

    <text x="24" y="30" font-size="14" font-weight="bold" fill="#1f2937">1. US-003 Adopting follows opening</text>
    <text x="24" y="51" font-size="14" fill="#374151">The plan renders complete first; the offer comes after, per type.</text>
    <g transform="translate(24, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#0891b2"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">US-003</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-025</text>
      <rect x="138" width="62" height="20" rx="10" fill="#2563eb"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-015</text>
      <rect x="207" width="62" height="20" rx="10" fill="#ea580c"/><text x="238" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-001</text>
    </g>

    <text x="560" y="30" font-size="14" font-weight="bold" fill="#1f2937">2. Never overwrite what you have</text>
    <text x="560" y="51" font-size="14" fill="#374151">A type already in the catalogue is skipped, and the plan is untouched.</text>
    <g transform="translate(560, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-025</text>
    </g>

    <text x="1096" y="30" font-size="14" font-weight="bold" fill="#1f2937">3. US-004 Copies are bounded</text>
    <text x="1096" y="51" font-size="14" fill="#374151">One slot per kind; a repeat replaces rather than accumulates.</text>
    <g transform="translate(1096, 61)">
      <rect x="0" width="62" height="20" rx="10" fill="#0891b2"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">US-004</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-024</text>
      <rect x="138" width="62" height="20" rx="10" fill="#ea580c"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-003</text>
    </g>

    <text x="24" y="126" font-size="14" font-weight="bold" fill="#1f2937">4. Clearing is offered, never done for you</text>
    <text x="24" y="147" font-size="14" fill="#374151">Redundant only means it is now safe to ask. Removal needs your word.</text>
    <g transform="translate(24, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-024</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-012</text>
      <rect x="138" width="62" height="20" rx="10" fill="#2563eb"/><text x="169" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-020</text>
    </g>

    <text x="560" y="126" font-size="14" font-weight="bold" fill="#1f2937">5. US-001 A fast answer is not a final one</text>
    <text x="560" y="147" font-size="14" fill="#374151">Escape discards; the discard stays in recovery until declined.</text>
    <g transform="translate(560, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#0891b2"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">US-001</text>
      <rect x="69" width="62" height="20" rx="10" fill="#2563eb"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-006</text>
      <rect x="138" width="72" height="20" rx="10" fill="#2563eb"/><text x="174" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-006a</text>
      <rect x="219" width="62" height="20" rx="10" fill="#2563eb"/><text x="250" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-009</text>
      <rect x="288" width="62" height="20" rx="10" fill="#ea580c"/><text x="319" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-003</text>
    </g>

    <text x="1096" y="126" font-size="14" font-weight="bold" fill="#1f2937">6. A readable copy is not the original</text>
    <text x="1096" y="147" font-size="14" fill="#374151">Save As warns on both counts: content dropped, original still needed.</text>
    <g transform="translate(1096, 157)">
      <rect x="0" width="62" height="20" rx="10" fill="#2563eb"/><text x="31" y="14" font-size="14" fill="#fff" text-anchor="middle">FR-021</text>
      <rect x="69" width="62" height="20" rx="10" fill="#ea580c"/><text x="100" y="14" font-size="14" fill="#fff" text-anchor="middle">SC-003</text>
    </g>
  </g>

  <text x="960" y="1060" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold" fill="#4b5563">003:03 | Project Files | SpecKit</text>
</svg>
